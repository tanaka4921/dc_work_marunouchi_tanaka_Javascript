<html lang = "ja">
    <head>

        <title>簡易ピアノアプリ</title>

    </head>
    <body>
        <header>
            <h1>簡易ピアノアプリ</h1>
            <button id = "auto-play" type = "button">自動演奏</button>
            <div id="support-wrapper">
                <button id = "play-support" type = "button">演奏補助</button>
                <ul id="song-select"></ul>
            </div>
        </header>
        <main>
            <div id = "name-wrapper">
                <div class = "song-name">
                    <div id = "song-name"></div>
                </div>
                <div class = "sound-name">
                    <div id = "sound-name"></div>
                </div>
            </div>
            <fieldset id = "piano-keyboard">
                <button id = "key-do" type = "button">ド</button>
                <button id = "key-re" type = "button">レ</button>
                <button id = "key-mi" type = "button">ミ</button>
                <button id = "key-fa" type = "button">ファ</button>
                <button id = "key-so" type = "button">ソ</button>
                <button id = "key-ra" type = "button">ラ</button>
                <button id = "key-si" type = "button">シ</button>
                <button id = "highkey-do" type = "button">ド</button>
            </fieldset>
        </main>
        <footer>
            <p class="warning"><small>※音が出ます。</small></p>
            <p class="credit"><small>音源素材：<a href = "https://maou.audio/" target = "_blank" rel = "noopener noreferrer">魔王魂</a></small></p>
        </footer>
        <script>
            const autoPlay = document.getElementById('auto-play');
            const playSupport = document.getElementById('play-support');
            const songSelect = document.getElementById('song-select');
            let songName = document.getElementById('song-name');
            let soundName = document.getElementById('sound-name');
            const pianoKeyboard = document.getElementById('piano-keyboard');
            const keyDO = document.getElementById('key-do');
            const keyRe = document.getElementById('key-re');
            const keyMi = document.getElementById('key-mi');
            const keyFa = document.getElementById('key-fa');
            const keySo = document.getElementById('key-so');
            const keyRa = document.getElementById('key-ra');
            const keySi = document.getElementById('key-si');
            const highKeyDo = document.getElementById('highkey-do');
            
            //選択された音階の名前を表示する
            let timerId = null;
            function displaySoundName(keyElement){
                if(timerId !== null){
                    clearTimeout(timerId)
                }
                if(keyElement === null){
                    soundName.textContent = "";
                    return;
                }
                soundName.textContent = keyElement.textContent;
                timerId = setTimeout(()=>{
                    soundName.textContent = "";
                    timerId = null;
                },1000);
            }

            //選択された音を再生する
            function playSound(keyElement){
                if(keyElement === null){
                    return;
                }
                const audio = audioMap[keyElement.id]
                audio.currentTime = 0;
                audio.play();
            }

            //自動演奏開始の関数
            let playingTimers = [];
            let endTimer ; 
            function startAutoPlay(){
                playingTimers = [];
                const randomScore = allScores[Math.floor(Math.random()*allScores.length)];
                songName.textContent = `自動演奏中です。曲名：${randomScore.title}`;
                randomScore.data.forEach(score=>{
                    const playingTimer = setTimeout(()=>{
                        displaySoundName(score.key);
                        playSound(score.key);
                    },score.time);
                    playingTimers.push(playingTimer);
                })
                endTimer = setTimeout(()=>{
                    playStatus = false;
                    autoPlay.textContent = "自動演奏";
                    songName.textContent = "";
                    pianoKeyboard.disabled = false;
                },randomScore.endTime)
            }

            //自動演奏停止
            function stopAutoPlay(){
                playingTimers.forEach(playingTimer=>{
                    clearTimeout(playingTimer);
                });
                clearTimeout(endTimer);
            }

            //演奏補助を始める関数
            let currentScore = null;
            let currentIndex = 0;
            function startSupportPlay(seletetedScore){
                currentIndex = 0;
                currentScore = seletetedScore;
                highlightNextKey();
            }

            //演奏補助内で次のキーを教えてくれる関数
            function highlightNextKey(){
                if(currentIndex >= currentScore.data.length){
                    songName.textContent = "";
                    playSupport.textContent = "演奏補助";
                    currentScore = null;
                    return;
                }
                const nextKey = currentScore.data[currentIndex].key;
                if(nextKey !== null){
                    nextKey.classList.add("highlight");
                }
                if(nextKey === null){
                    currentIndex++;
                    highlightNextKey();
                }
            }
            
            //自動演奏クリック時の動作      
            let playStatus = false;      
            autoPlay.addEventListener('click',(e)=>{
                if(currentScore !== null){
                    currentScore.data[currentIndex].key.classList.remove('highlight');
                    currentScore = null;
                    playSupport.textContent = "演奏補助";
                }
                if(playStatus === false){
                    startAutoPlay();
                    playStatus = true;
                    autoPlay.textContent = "演奏中止";
                    playSupport.disabled = true;
                    pianoKeyboard.disabled = true;
                }
                else if(playStatus === true){
                    stopAutoPlay();
                    playStatus = false;
                    autoPlay.textContent = "自動演奏";
                    songName.textContent = "";
                    pianoKeyboard.disabled = false;
                    playSupport.disabled = false;
                }
            });

            //演奏補助のボタンを押したときの動作
            playSupport.addEventListener('click',()=>{
                if(currentScore === null){
                    songSelect.classList.toggle('open');
                }else{
                    currentScore.data[currentIndex].key.classList.remove('highlight');
                    currentScore = null;
                    playSupport.textContent = "演奏補助";
                    songName.textContent = "";
                }
            });

            //クリックされたときの動作
            pianoKeyboard.addEventListener('click',(e)=>{
                if(e.target.tagName === "BUTTON"){
                    displaySoundName(e.target);
                    playSound(e.target);
                    //演奏補助のときに指定の鍵盤を押したときの動作
                    if(currentScore !== null && e.target === currentScore.data[currentIndex].key){
                        e.target.classList.remove("highlight");
                        currentIndex++;
                        highlightNextKey();

            //演奏補助の曲名リストを作る

                    //演奏補助の曲を選んだときの動作
                    li.addEventListener('click',()=>{
                        startSupportPlay(score);
                        songSelect.classList.remove('open');
                        songName.textContent = `演奏補助中 曲名：${currentScore.title}`;
