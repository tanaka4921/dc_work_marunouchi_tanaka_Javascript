<!DOCTYPE html>
<html lang = "ja">
    <head>
        <meta charset = "UTF-8">
        <title>簡易ピアノアプリ</title>
        <link rel = "stylesheet" href = "style.css">
    </head>
    <body>
        <header>
            <h1>簡易ピアノアプリ</h1>
            <button id = "auto-play" type = "button">自動演奏</button>
            <div id="support-wrapper">
                <button id = "play-support" type = "button">演奏補助</button>
                <ul id="song-select"></ul>
            </div>
        </header>
        <main>
            <div id = "name-wrapper">
                <div class = "song-name">
                    <div id = "song-name"></div>
                </div>
                <div class = "sound-name">
                    <div id = "sound-name"></div>
                </div>
            </div>
            <fieldset id = "piano-keyboard">
                <button id = "key-do" type = "button">ド</button>
                <button id = "key-re" type = "button">レ</button>
                <button id = "key-mi" type = "button">ミ</button>
                <button id = "key-fa" type = "button">ファ</button>
                <button id = "key-so" type = "button">ソ</button>
                <button id = "key-ra" type = "button">ラ</button>
                <button id = "key-si" type = "button">シ</button>
                <button id = "highkey-do" type = "button">ド</button>
            </fieldset>
        </main>
        <footer>
            <p class="warning"><small>※音が出ます。</small></p>
            <p class="credit"><small>音源素材：<a href = "https://maou.audio/" target = "_blank" rel = "noopener noreferrer">魔王魂</a></small></p>
        </footer>
        <script>
            const autoPlayButton = document.getElementById('auto-play');
            const supportPlayButton = document.getElementById('play-support');
            const songSelectList = document.getElementById('song-select');
            const songNameDisplay = document.getElementById('song-name');
            const soundNameDisplay = document.getElementById('sound-name');
            const pianoKeyboard = document.getElementById('piano-keyboard');
            const doKey = document.getElementById('key-do');
            const reKey = document.getElementById('key-re');
            const miKey = document.getElementById('key-mi');
            const faKey = document.getElementById('key-fa');
            const soKey = document.getElementById('key-so');
            const raKey = document.getElementById('key-ra');
            const siKey = document.getElementById('key-si');
            const highDoKey = document.getElementById('highkey-do');
            
            //音のデータ
            const pianoSounds = {
                'key-do':  new Audio('piano-sound/maou_se_inst_piano1_1do.mp3'),
                'key-re':  new Audio('piano-sound/maou_se_inst_piano1_2re.mp3'),
                'key-mi':  new Audio('piano-sound/maou_se_inst_piano1_3mi.mp3'),
                'key-fa':  new Audio('piano-sound/maou_se_inst_piano1_4fa.mp3'),
                'key-so':  new Audio('piano-sound/maou_se_inst_piano1_5so.mp3'),
                'key-ra':  new Audio('piano-sound/maou_se_inst_piano1_6ra.mp3'),
                'key-si':  new Audio('piano-sound/maou_se_inst_piano1_7si.mp3'),
                'highkey-do':  new Audio('piano-sound/maou_se_inst_piano1_8do.mp3')
            };
            
            //noteをelementにする対応表
            const noteToElement = {
                "ド": doKey,
                "レ": reKey,
                "ミ": miKey,
                "ファ": faKey,
                "ソ": soKey,
                "ラ": raKey,
                "シ": siKey,
                "休符": null
            };

            //選択された音階の名前を表示する
            let sonudNameTimerId = null;
            function showSoundName(keyElement){
                if (sonudNameTimerId !== null){
                    clearTimeout(sonudNameTimerId)
                }
                if (keyElement === null){
                    soundNameDisplay.textContent = "";
                    return;
                }
                soundNameDisplay.textContent = keyElement.textContent;
                sonudNameTimerId = setTimeout(()=>{
                    soundNameDisplay.textContent = "";
                    sonudNameTimerId = null;
                },1000);
            }

            //選択された音を再生する
            function playKeySound(keyElement){
                if (keyElement === null){
                    return;
                }
                const pianoSound = pianoSounds[keyElement.id]
                pianoSound.currentTime = 0;
                pianoSound.play();
            }
            
            let autoPlayTimerIds = [];
            let autoPlayEndTimerId = null; 
            let isAutoPlaying = false; 

            //自動演奏終了時の表示やボタンを元に戻す
            function finishAutoPlay(){ 
                isAutoPlaying = false;
                autoPlayTimerIds = [];
                autoPlayEndTimerId = null;
                autoPlayButton.textContent = "自動演奏";
                songNameDisplay.textContent = "";
                pianoKeyboard.disabled = false;
                supportPlayButton.disabled = false;
            }
            
            //自動演奏を開始する
            function startAutoPlay(){
                autoPlayTimerIds = [];
                isAutoPlaying = true;
                autoPlayButton.textContent = "演奏中止";
                supportPlayButton.disabled = true;
                pianoKeyboard.disabled = true;
                const selectedScore = allScores[Math.floor(Math.random()*allScores.length)];
                songNameDisplay.textContent = `自動演奏中です。曲名：${selectedScore.title}`;
                selectedScore.data.forEach(note=>{
                    const playingTimer = setTimeout(()=>{
                        showSoundName(noteToElement[note.key]);
                        playKeySound(noteToElement[note.key]);
                    },note.time);
                    autoPlayTimerIds.push(playingTimer);
                })
                autoPlayEndTimerId = setTimeout(()=>{
                    finishAutoPlay();
                },selectedScore.endTime)
            }

            //自動演奏停を停止する
            function stopAutoPlay(){
                autoPlayTimerIds.forEach(playingTimer=>{
                    clearTimeout(playingTimer);
                });
                if(autoPlayEndTimerId !== null){
                    clearTimeout(autoPlayEndTimerId)
                };
                finishAutoPlay();
            }

            //演奏補助を開始する
            let supportScore = null;
            let supportNoteIndex = 0;
            function startSupportPlay(selectedScore){
                supportNoteIndex = 0;
                supportScore = selectedScore;
                songNameDisplay.textContent = `演奏補助中 曲名：${supportScore.title}`;
                supportPlayButton.textContent = "補助中止";
                highlightNextKey();
            }

            //演奏補助を終了する
            function finishSupportPlay(){
                if(supportScore !== null){
                    const currentNote = noteToElement[supportScore.data[supportNoteIndex].key];
                    if(currentNote !== undefined && currentNote !== null){
                        currentNote.classList.remove('highlight');
                    } 
                }
                supportScore = null;
                supportNoteIndex = 0;
                supportPlayButton.textContent = "演奏補助";
                songNameDisplay.textContent = "";
            }
            //演奏補助内で次のキーを教えてくれる関数
            function highlightNextKey(){
                if (supportScore === null){
                    return;
                }

                if (supportNoteIndex >= supportScore.data.length){
                    finishSupportPlay();
                    return;
                }

                const nextKey = noteToElement[supportScore.data[supportNoteIndex].key];

                if (nextKey === null){
                    supportNoteIndex++;
                    highlightNextKey();
                    return;
                }
                nextKey.classList.add("highlight");
            }
            
            //自動演奏クリック時の動作                
            autoPlayButton.addEventListener('click',(e)=>{
                if (supportScore !== null){
                    finishSupportPlay();
                }
                if (isAutoPlaying === false){
                    startAutoPlay();                
                } else if (isAutoPlaying === true){
                    stopAutoPlay();                  
                }
            });

            //演奏補助のボタンを押したときの動作
            supportPlayButton.addEventListener('click',()=>{
                if (supportScore === null){
                    songSelectList.classList.toggle('open');
                } else {
                   finishSupportPlay();
                }
            });

            //クリックされたときの動作
            pianoKeyboard.addEventListener('click',(event)=>{
                const clickedElement = event.target;
                if (clickedElement instanceof HTMLButtonElement){
                    showSoundName(clickedElement);
                    playKeySound(clickedElement);
                    //演奏補助のときに指定の鍵盤を押したときの動作
                    if (supportScore !== null && clickedElement === noteToElement[supportScore.data[supportNoteIndex].key]){
                        clickedElement.classList.remove("highlight");
                        supportNoteIndex++;
                        highlightNextKey();
                    }
                }
            });
             
            //楽譜データの正規表示パターン
            const notePattern = (/(ド|レ|ミ|ファ|ソ|ラ|シ|休符)\(([\d.]+)秒\)/g);
            
            //楽譜の演奏タイミングの時間を計算する  
            let noteTime = 0;    
            function calcNoteTime(duration){ 
                const time = noteTime;
                noteTime += duration;
                return time;
            }

            //楽譜データを正規表示する
            function parseScore(score){
                noteTime = 0;
                return [...score.matchAll(notePattern)]
                        .map(([, key, duration])=>{
                        const durationMs = parseFloat(duration)*1000;
                            return{               
                                key,
                                duration : durationMs, 
                                time : calcNoteTime(durationMs)           
                            }
                        });
            }

            //きらきら星の楽譜データ
            const twinkleStarScore = `ド(0.5秒)休符(0.5秒)ド(0.5秒)休符(0.5秒)ソ(0.5秒)休符(0.5秒)ソ(0.5秒)休符(0.5秒)
                                     ラ(0.5秒)休符(0.5秒)ラ(0.5秒)休符(0.5秒)ソ(2秒)
                                     ファ(0.5秒)休符(0.5秒)ファ(0.5秒)休符(0.5秒)ミ(0.5秒)休符(0.5秒)ミ(0.5秒)休符(0.5秒)
                                     レ(0.5秒)休符(0.5秒)レ(0.5秒)休符(0.5秒)ド(2秒)

                                     ソ(0.5秒)休符(0.5秒)ソ(0.5秒)休符(0.5秒)ファ(0.5秒)休符(0.5秒)ファ(0.5秒)休符(0.5秒)
                                     ミ(0.5秒)休符(0.5秒)ミ(0.5秒)休符(0.5秒)レ(2秒)
                                     ソ(0.5秒)休符(0.5秒)ソ(0.5秒)休符(0.5秒)ファ(0.5秒)休符(0.5秒)ファ(0.5秒)休符(0.5秒)
                                     ミ(0.5秒)休符(0.5秒)ミ(0.5秒)休符(0.5秒)レ(2秒)

                                     ド(0.5秒)休符(0.5秒)ド(0.5秒)休符(0.5秒)ソ(0.5秒)休符(0.5秒)ソ(0.5秒)休符(0.5秒)
                                     ラ(0.5秒)休符(0.5秒)ラ(0.5秒)休符(0.5秒)ソ(2秒)
                                     ファ(0.5秒)休符(0.5秒)ファ(0.5秒)休符(0.5秒)ミ(0.5秒)休符(0.5秒)ミ(0.5秒)休符(0.5秒)
                                     レ(0.5秒)休符(0.5秒)レ(0.5秒)休符(0.5秒)ド(4秒)`;
            const twinkleStarNote = parseScore(twinkleStarScore);
           
            //チューリップの楽譜データ
            const tulipScore = `ド(0.5秒)レ(0.5秒)ミ(1秒)ド(0.5秒)レ(0.5秒)ミ(1秒)
                               ソ(0.5秒)ミ(0.5秒)レ(0.5秒)ド(0.5秒)レ(0.5秒)ミ(0.5秒)レ(1秒)
                               ド(0.5秒)レ(0.5秒)ミ(1秒)ド(0.5秒)レ(0.5秒)ミ(1秒)ソ(0.5秒)ミ(0.5秒)レ(0.5秒)ド(0.5秒)レ(0.5秒)ミ(0.5秒)ド(1秒)
                               ソ(0.25秒)休符(0.25秒)ソ(0.25秒)休符(0.25秒)ミ(0.25秒)休符(0.25秒)ソ(0.25秒)休符(0.25秒)
                               ラ(0.25秒)休符(0.25秒)ラ(0.25秒)休符(0.25秒)ソ(1秒)
                               ミ(0.25秒)休符(0.25秒)ミ(0.25秒)休符(0.25秒)レ(0.25秒)休符(0.25秒)レ(0.25秒)休符(0.25秒)ド(4秒)`;
            const tulipNote = parseScore(tulipScore);

            

            //楽譜の終了タイミングを合計する
            function calcEndTime(notes){
                return notes.reduce((endTime, note)=> endTime + note.duration, 0);
            }

            //楽譜全部合わせたものを作る
            function createScore(title, notes){
                return {
                    title : title,
                    data : notes,
                    endTime : calcEndTime(notes)
                };
            }

            const allScores = [
                createScore("きらきら星", twinkleStarNote) ,
                createScore("チューリップ", tulipNote)
            ];
            console.log(allScores);
            //演奏補助の曲名リストを作る
            (function createSupportScore(){
                allScores.forEach(score=>{
                    const songListItem = document.createElement('li');
                    songListItem.textContent = score.title;
                    songSelectList.appendChild(songListItem);
                    //演奏補助の曲を選んだときの動作
                    songListItem.addEventListener('click',()=>{
                        startSupportPlay(score);
                        songSelectList.classList.remove('open');                      
                    })
                })
            })();
 
        </script>
    </body>
</html>
